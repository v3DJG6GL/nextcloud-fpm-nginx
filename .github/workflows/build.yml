# .forgejo/workflows/build.yml
#
# Forgejo Actions port of the GitHub workflow. Structural changes vs. the
# GitHub original:
#
#   * Registry: ghcr.io -> self-hosted Forgejo container registry (REGISTRY
#     env below). Auth via a PAT (secrets.REGISTRY_USER / REGISTRY_TOKEN,
#     scope package:read for the gate, package:write for publish) instead of
#     the ephemeral GITHUB_TOKEN.
#   * Removed all GitHub-VM plumbing: mirror.gcr.io daemon.json rewrites
#     (impossible in a container job; put --registry-mirror on the dind
#     daemon instead if wanted), free-disk-space, wretry retry wrappers,
#     buildkit boot-image pin + buildkitd-mirror.toml.
#   * arm64 dropped entirely (no ARM runner; QEMU builds not worth it) —
#     test-arm64-smoke job deleted, publish is linux/amd64 only.
#   * Buildx cache: type=gha -> type=registry on the Forgejo registry
#     (deterministic; the runner's GHA-compatible cache server may also
#     work with type=gha, but registry cache has no compat question).
#   * Actions are referenced fully-qualified (https://github.com/...) so
#     resolution never depends on DEFAULT_ACTIONS_URL / what
#     code.forgejo.org happens to mirror.
#   * provenance/sbom disabled: buildx attestations create unknown/unknown
#     manifest entries that Forgejo's registry has historically not
#     accepted/displayed cleanly. Re-enable and test if desired.
#   * permissions:, checks: — GitHub token-permission model; dropped.
#
# Runner prerequisites (see runner-config.yml):
#   * ubuntu-latest label mapped to an image with docker CLI + compose,
#     e.g. docker://ghcr.io/catthehacker/ubuntu:act-22.04
#   * container.docker_host left at default ("") so job containers get the
#     runner's DOCKER_HOST (the shared dind daemon) for buildx/load/compose.

name: build

on:
  push:
    branches: [main, master]
    # Paths filter on push only — saves a full-matrix run on commits whose
    # touched files don't affect the image (READMEs, docs, …).
    paths:
      - Dockerfile
      - nginx.conf
      - supervisord.conf
      - snippets/**
      - scripts/**
      - tests/**
      - compose.yaml
      - .forgejo/workflows/build.yml
  # No paths filter on pull_request — every PR must run the full matrix so
  # the required `all-ci` check actually reports.
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild every in-window major (bypass digest + staleness gates)'
        type: boolean
        default: false
  schedule:
    # Twice daily; both gates apply (digest drift + >=14d staleness).
    # A run where nothing drifted and nothing is stale is a ~30s no-op.
    # (The GitHub off-peak-minute reasoning no longer applies on a
    # self-hosted runner — times are arbitrary.)
    - cron: '25 5 * * *'
    - cron: '35 17 * * *'

# Cancel superseded PR runs (push/schedule runs are kept to avoid disrupting
# in-flight publishes). Note: older Forgejo versions ignore `concurrency`
# entirely — harmless if so.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: forgejo.informethic.ch
  IMAGE: nextcloud-fpm-nginx

jobs:
  compute-matrix:
    name: Compute build matrix from upstream versions.json
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.set.outputs.builds }}
      latest: ${{ steps.set.outputs.latest }}
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v6

      - name: Install crane
        env:
          # renovate: datasource=github-releases depName=google/go-containerregistry
          CRANE_VERSION: v0.21.7
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Log crane in to the Forgejo registry
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$TOKEN" | crane auth login "$REGISTRY" \
            --username "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - id: set
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          OWNER: ${{ github.repository_owner }}
          STALENESS_DAYS: '14'
          # Build only the newest N currently-supported majors (rolling
          # window). 0 = build every supported major.
          KEEP_LATEST_MAJORS: '2'
        run: |
          set -euo pipefail

          # Registry repository paths are lowercase, but repository_owner can
          # be mixed-case. crane rejects an upper-case ref, and the digest
          # gate below swallows that error (2>/dev/null) — reading it as
          # "registry-tag-missing" and forcing a full rebuild+push of every
          # major on EVERY scheduled run. Lower-case once here. (The publish
          # job is unaffected: metadata-action lower-cases the ref itself.)
          owner_lc=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')

          # Build only the newest KEEP_LATEST_MAJORS supported majors.
          # Upstream's versions.json lists every currently-supported major;
          # sort ascending, keep the last N. When upstream cuts a new major
          # the window rolls forward on its own. Existing pinned tags on the
          # registry stay available; they just stop getting new builds.
          keep="${KEEP_LATEST_MAJORS:-0}"
          case "$keep" in
            ''|*[!0-9]*)
              echo "::error::KEEP_LATEST_MAJORS must be a non-negative integer (got '$keep')"
              exit 1
              ;;
          esac
          keep=$((10#$keep))
          echo "Keep latest majors: $( [ "$keep" -eq 0 ] && echo '<all>' || echo "$keep" )"

          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors \
            https://raw.githubusercontent.com/nextcloud/docker/master/versions.json \
            > versions.json

          jq -c --argjson keep "$keep" '
            [ to_entries[]
              | { major: .key, version: .value.version, no_cache: false } ]
            | sort_by(.major | tonumber)
            | if $keep > 0 then .[ ([length - $keep, 0] | max) : ] else . end
          ' versions.json > full-builds.json

          echo "Candidate builds (pre-gate):"
          jq . full-builds.json

          # ── Base-image existence pre-filter (all events) ─────────────────
          # versions.json is bumped by upstream nextcloud/docker BEFORE the
          # matching nextcloud:<ver>-fpm image is published to Docker Hub —
          # a multi-hour race. Building FROM a not-yet-published base fails
          # the whole cell. Drop a major only when its base tag is GENUINELY
          # absent; on a transient error keep it (fail-open).
          #
          # On a manual workflow_dispatch, fall back to the latest published
          # <major>.x.y-fpm patch so the "Run workflow" button always yields
          # a buildable matrix. Scheduled/push/PR runs keep waiting.
          base_status() {
            # 0 = exists, 1 = genuinely absent, 2 = undetermined (transient)
            local ref="$1" out
            local attempt
            for attempt in 1 2 3; do
              if out=$(crane digest "$ref" 2>&1); then
                return 0
              fi
              if printf '%s' "$out" | grep -qiE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|not found|404'; then
                return 1
              fi
              sleep $(( attempt * 3 ))
            done
            return 2
          }

          # Newest published <major>.x.y-fpm patch on Docker Hub (empty if
          # none). `-fpm$` anchor excludes -fpm-alpine and rolling tags.
          latest_published_patch() {
            local major="$1"
            crane ls docker.io/library/nextcloud 2>/dev/null \
              | grep -E "^${major}\.[0-9]+\.[0-9]+-fpm$" \
              | sed 's/-fpm$//' \
              | sort -V \
              | tail -n1 || true
          }

          echo "Verifying upstream base images are published…"
          published='[]'
          while IFS= read -r row; do
            major=$(jq -r '.major' <<<"$row")
            version=$(jq -r '.version' <<<"$row")
            ref="docker.io/library/nextcloud:${version}-fpm"
            if base_status "$ref"; then
              published=$(jq -c --argjson r "$row" '. + [$r]' <<<"$published")
            elif [ $? -eq 1 ]; then
              if [ "$EVENT" = "workflow_dispatch" ]; then
                fallback=$(latest_published_patch "$major")
                if [ -n "$fallback" ] && base_status "docker.io/library/nextcloud:${fallback}-fpm"; then
                  echo "::warning::[$major] $ref not published yet — manual dispatch: building latest published patch ${fallback}-fpm instead"
                  row=$(jq -c --arg v "$fallback" '.version = $v' <<<"$row")
                  published=$(jq -c --argjson r "$row" '. + [$r]' <<<"$published")
                else
                  echo "::warning::[$major] $ref not published and no published ${major}.x.y-fpm patch found — skipping"
                fi
              else
                echo "::warning::[$major] $ref not published on Docker Hub yet — skipping until it lands"
              fi
            else
              echo "::warning::[$major] could not verify $ref (transient registry error) — keeping (fail-open)"
              published=$(jq -c --argjson r "$row" '. + [$r]' <<<"$published")
            fi
          done < <(jq -c '.[]' full-builds.json)
          printf '%s' "$published" > full-builds.json

          echo "Candidate builds (base published):"
          jq . full-builds.json

          if [ "$(jq 'length' full-builds.json)" -eq 0 ]; then
            echo "No buildable majors after existence filter — emitting empty matrix."
            echo "builds=[]" >> "$GITHUB_OUTPUT"
            echo "latest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(jq -r 'map(.major | tonumber) | max' full-builds.json)
          echo "Latest in-window major: $latest"

          # ── Gate selection ───────────────────────────────────────────────
          # push / pull_request  → full matrix (paths filter already gated)
          # workflow_dispatch    → full matrix when force=true, else gates
          # schedule             → both gates apply
          # ─────────────────────────────────────────────────────────────────
          apply_gates=no
          case "$EVENT" in
            schedule) apply_gates=yes ;;
            workflow_dispatch) [ "$FORCE" = "true" ] || apply_gates=yes ;;
          esac

          if [ "$apply_gates" = "no" ]; then
            builds=$(cat full-builds.json)
            echo "No gate applied (event=$EVENT) — building full matrix."
          else
            echo "Applying gates: digest-drift + staleness (>=${STALENESS_DAYS}d)"
            filtered='[]'
            now_epoch=$(date +%s)
            while IFS= read -r row; do
              major=$(jq -r '.major' <<<"$row")
              version=$(jq -r '.version' <<<"$row")
              reg_ref="${REGISTRY}/${owner_lc}/${IMAGE}:v${version}"
              upstream_ref="docker.io/library/nextcloud:${version}-fpm"
              keep_reason=""
              no_cache=false

              # Digest-gate: failure to resolve upstream is fail-open
              # (rebuild) so a registry hiccup never silently leaves us on a
              # stale base.
              upstream_digest=$(crane digest "$upstream_ref" 2>/dev/null || true)
              if [ -z "$upstream_digest" ]; then
                echo "::warning::[$major] could not resolve $upstream_ref — including in build (fail-open)"
                keep_reason="upstream-resolve-failed"
              else
                # Resolve our own published config. Distinguish a genuine
                # "not published yet" (404 → legitimate tag-missing rebuild,
                # e.g. a brand-new major) from ANY other crane failure (bad
                # ref, auth, transient error) — surface those loudly instead
                # of silently rebuilding every run.
                if our_cfg=$(crane config "$reg_ref" 2>config_err); then
                  our_digest=$(jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty' <<<"$our_cfg")
                  if [ -z "$our_digest" ]; then
                    keep_reason="base-digest-label-missing"
                  elif [ "$our_digest" != "$upstream_digest" ]; then
                    keep_reason="base-digest-drift ($our_digest -> $upstream_digest)"
                  fi
                elif grep -qiE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|not found|404' config_err; then
                  keep_reason="registry-tag-missing"
                else
                  echo "::warning::[$major] crane config $reg_ref failed (not a 404) — building (fail-open). crane: $(tr '\n' ' ' <config_err)"
                  keep_reason="registry-config-error"
                fi
              fi

              # Staleness-gate: only when no digest-rebuild already queued.
              # Force no-cache for any major whose published image hasn't
              # been refreshed in STALENESS_DAYS — refreshes transitive apt
              # deps (libssl, pcre, zlib, …).
              if [ -z "$keep_reason" ] && [ -n "${our_cfg:-}" ]; then
                created=$(jq -r '.config.Labels["org.opencontainers.image.created"] // empty' <<<"$our_cfg")
                if [ -z "$created" ]; then
                  keep_reason="created-label-missing (treat as stale)"
                  no_cache=true
                else
                  created_epoch=$(date -d "$created" +%s 2>/dev/null || echo 0)
                  age_days=$(( (now_epoch - created_epoch) / 86400 ))
                  if [ "$created_epoch" -gt 0 ] && [ "$age_days" -ge "$STALENESS_DAYS" ]; then
                    keep_reason="staleness ${age_days}d >= ${STALENESS_DAYS}d"
                    no_cache=true
                  fi
                fi
              fi

              if [ -n "$keep_reason" ]; then
                echo "[$major] REBUILD (no_cache=$no_cache): $keep_reason"
                filtered=$(jq -c \
                  --arg major "$major" \
                  --arg version "$version" \
                  --argjson nc "$no_cache" \
                  '. + [{ major: $major, version: $version, no_cache: $nc }]' \
                  <<<"$filtered")
              else
                echo "::notice::[$major] up to date — base digest matches upstream and image is fresh; skipping rebuild (v$version)"
              fi
            done < <(jq -c '.[]' full-builds.json)
            builds="$filtered"
          fi

          echo "Final builds:"
          echo "$builds" | jq
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  # ─── amd64 test (Pattern A: build → load → test → only-then-push) ───
  # For each <major> × <scenario> cell:
  #   1. Build amd64 into the shared dind daemon (load: true).
  #   2. Run container-structure-test against the static image.
  #   3. Boot a docker compose fixture + run bats runtime tests.
  # The `build` job below blocks on this passing.
  test:
    name: Test (amd64) — ${{ matrix.build.major }} / ${{ matrix.scenario.id }}
    needs: compute-matrix
    # Skip cleanly when the gate filtered every major (cron no-op).
    if: needs.compute-matrix.outputs.builds != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.compute-matrix.outputs.builds) }}
        scenario:
          - { id: sqlite-noredis-cron-none,                db: sqlite,   redis: 'false', notify_push: 'false', cron: none }
          - { id: sqlite-noredis-cron-incontainer,         db: sqlite,   redis: 'false', notify_push: 'false', cron: incontainer }
          - { id: sqlite-noredis-cron-sidecar,             db: sqlite,   redis: 'false', notify_push: 'false', cron: sidecar }
          - { id: postgres-redis-notify-cron-none,         db: postgres, redis: 'true',  notify_push: 'true',  cron: none }
          - { id: postgres-redis-notify-cron-incontainer,  db: postgres, redis: 'true',  notify_push: 'true',  cron: incontainer }
          - { id: postgres-redis-notify-cron-sidecar,      db: postgres, redis: 'true',  notify_push: 'true',  cron: sidecar }
          - { id: postgres-redis-nopush-cron-none,         db: postgres, redis: 'true',  notify_push: 'false', cron: none }
          - { id: postgres-redis-nopush-cron-incontainer,  db: postgres, redis: 'true',  notify_push: 'false', cron: incontainer }
          - { id: postgres-redis-nopush-cron-sidecar,      db: postgres, redis: 'true',  notify_push: 'false', cron: sidecar }
          - { id: mysql-redis-notify-cron-none,            db: mysql,    redis: 'true',  notify_push: 'true',  cron: none }
          - { id: mysql-redis-notify-cron-incontainer,     db: mysql,    redis: 'true',  notify_push: 'true',  cron: incontainer }
          - { id: mysql-redis-notify-cron-sidecar,         db: mysql,    redis: 'true',  notify_push: 'true',  cron: sidecar }
          - { id: mysql-redis-nopush-cron-none,            db: mysql,    redis: 'true',  notify_push: 'false', cron: none }
          - { id: mysql-redis-nopush-cron-incontainer,     db: mysql,    redis: 'true',  notify_push: 'false', cron: incontainer }
          - { id: mysql-redis-nopush-cron-sidecar,         db: mysql,    redis: 'true',  notify_push: 'false', cron: sidecar }
        # KEEP_LATEST_MAJORS majors × 15 scenarios (default 2 → 30 cells).
        # NOTE: on a single self-hosted runner these queue up to the
        # runner's `capacity` — consider trimming the scenario list for
        # push/PR events if wall-clock time becomes a problem.
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v6

      # tests/bats/28-config-drift.bats runs `php -l` on the job host to
      # syntax-check a fixture. The catthehacker act image has no PHP.
      - name: Install job deps (php-cli)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli

      - name: Set up Buildx
        uses: https://github.com/docker/setup-buildx-action@v4

      # Registry login needed here (not just in publish) because the buildx
      # cache now lives on the Forgejo registry (cache-to below).
      - name: Log in to the Forgejo registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build amd64 image (load into dind — Pattern A)
        uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          # Force-pull the base manifest so we test the SAME
          # nextcloud:<ver>-fpm the publish build ships. Without this, a
          # digest-drift rebuild resolves the base from dind's local cache
          # and would validate the OLD base while publish pulls the NEW one.
          pull: true
          # Match the publish build: when the staleness gate sets no_cache,
          # test the freshly-resolved apt layers that will actually ship.
          no-cache: ${{ matrix.build.no_cache }}
          tags: nextcloud-fpm-nginx:test-${{ matrix.build.major }}
          build-args: |
            NC_VERSION=${{ matrix.build.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:buildcache-${{ matrix.build.major }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:buildcache-${{ matrix.build.major }},mode=max

      - name: container-structure-test (image-static assertions)
        env:
          IMG: nextcloud-fpm-nginx:test-${{ matrix.build.major }}
          CST_VERSION: v1.22.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors -o /usr/local/bin/container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-amd64"
          chmod +x /usr/local/bin/container-structure-test
          container-structure-test test --image "$IMG" \
            --config tests/cst/base.yaml \
            --config tests/cst/nginx.yaml \
            --config tests/cst/php.yaml \
            --config tests/cst/notify_push.yaml

      - name: Install bats-core
        uses: https://github.com/bats-core/bats-action@4.0.0
        # Our suite loads only our own tests/helpers/*.bash — none of the
        # upstream helper libraries. Disabling the four unused installs
        # avoids their cache-restore noise and trims install time.
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run bats suite (runtime assertions)
        env:
          NC_IMAGE: nextcloud-fpm-nginx:test-${{ matrix.build.major }}
          NC_MAJOR: ${{ matrix.build.major }}
          SCENARIO_DB: ${{ matrix.scenario.db }}
          SCENARIO_REDIS: ${{ matrix.scenario.redis }}
          SCENARIO_NOTIFY_PUSH: ${{ matrix.scenario.notify_push }}
          SCENARIO_CRON: ${{ matrix.scenario.cron }}
        run: ./tests/run-all.sh

      - name: Upload JUnit results
        if: always()
        # v4: the newest artifact API generation Forgejo's artifact server
        # is known to support; bump once your instance handles newer.
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.build.major }}-${{ matrix.scenario.id }}
          path: tests/reports/*.xml

      - name: Surface bats failures in run summary
        if: always()
        # Forgejo's checks API compatibility is partial — worst case this
        # step fails to post check-runs; don't let that fail the cell.
        continue-on-error: true
        uses: https://github.com/mikepenz/action-junit-report@v6
        with:
          report_paths: tests/reports/*.xml
          check_name: bats / ${{ matrix.build.major }} / ${{ matrix.scenario.id }}

  # ─── Single umbrella check for branch-protection rulesets ───
  # The matrix-job names contain the NC major, so they change every time
  # upstream cuts a new major and aren't usable as stable required-status
  # contexts. `all-ci` is the stable gate.
  all-ci:
    name: all-ci
    needs: [compute-matrix, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          set -euo pipefail
          # `skipped` is acceptable on test: the compute-matrix gate may
          # filter every major on a cron run. compute-matrix itself must
          # always succeed (it's the gate).
          if [ "${{ needs.compute-matrix.result }}" != success ]; then
            echo "::error::compute-matrix=${{ needs.compute-matrix.result }}"
            exit 1
          fi
          case "${{ needs.test.result }}" in
            success|skipped) ;;
            *)
              echo "::error::test=${{ needs.test.result }}"
              exit 1
              ;;
          esac

  # ─── Build + push (only after tests pass) ───
  # Reuses the registry buildx cache populated by the test jobs, so the
  # build here is mostly cache hits — the manifest push is the real work.
  build:
    name: Build & push — v${{ matrix.build.version }}
    # Skip pushes on PRs — PR builds must not clobber published tags. The
    # push runs on the merge commit (push to master) instead. Also skip
    # when the gate filtered every major.
    if: github.event_name != 'pull_request' && needs.compute-matrix.outputs.builds != '[]'
    needs: [compute-matrix, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.compute-matrix.outputs.builds) }}
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v6

      - name: Set up Buildx
        uses: https://github.com/docker/setup-buildx-action@v4

      - name: Log in to the Forgejo registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: https://github.com/docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=v${{ matrix.build.version }}
            type=raw,value=v${{ matrix.build.major }}.0
            type=raw,value=v${{ matrix.build.major }}
            type=raw,value=latest,enable=${{ matrix.build.major == needs.compute-matrix.outputs.latest }}

      # Resolve the upstream FROM-image digest right before build, and bake
      # it into the published image as `org.opencontainers.image.base.digest`.
      # The compute-matrix gate reads this label on the next run to decide
      # whether the base has drifted. `pull: true` below forces buildx to
      # pull the latest manifest, so the digest captured here matches what
      # the build actually uses (within a tiny race window — any repush in
      # those seconds just causes one extra rebuild next run).
      - id: base
        name: Resolve upstream base digest
        env:
          # renovate: datasource=github-releases depName=google/go-containerregistry
          CRANE_VERSION: v0.21.7
          NC_VERSION: ${{ matrix.build.version }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          base_name="docker.io/library/nextcloud:${NC_VERSION}-fpm"
          base_digest=$(crane digest "$base_name")
          echo "base_name=$base_name" >> "$GITHUB_OUTPUT"
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"

      - uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          # no-cache=true skips ALL build cache. Set by the staleness branch
          # of the compute-matrix gate so apt re-resolves transitive deps
          # against current Debian repos. Digest-drift rebuilds leave this
          # false — the cache is invalidated by the new parent layer anyway.
          no-cache: ${{ matrix.build.no_cache }}
          build-args: |
            NC_VERSION=${{ matrix.build.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.base_digest }}
          # Attestation manifests (unknown/unknown platform entries) have a
          # spotty history with Gitea/Forgejo registries — off until you've
          # verified your instance handles them.
          provenance: false
          sbom: false
          # Read the cache the test job populated. No cache-to here: the
          # test job already exports mode=max to the same ref, so a second
          # export would never be consumed.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:buildcache-${{ matrix.build.major }}