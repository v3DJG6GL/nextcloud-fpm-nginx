name: build

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - nginx.conf
      - supervisord.conf
      - scripts/**
      - tests/**
      - .github/workflows/build.yml
      - .github/versions-blocklist.txt
  pull_request:
    paths:
      - Dockerfile
      - nginx.conf
      - supervisord.conf
      - scripts/**
      - tests/**
      - .github/workflows/build.yml
      - .github/versions-blocklist.txt
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild every non-blocklisted major (bypass base-digest gate)'
        type: boolean
        default: false
  schedule:
    # Daily 06:00 UTC. The compute-matrix job applies a base-digest gate, so a
    # cron run with no upstream change is a ~30s no-op — actual build work only
    # happens when versions.json bumps OR upstream rebuilds nextcloud:<ver>-fpm
    # in place (Debian/PHP CVE refresh; ~monthly cadence in practice).
    - cron: '0 6 * * *'

# Cancel superseded PR runs (push/schedule runs are kept to avoid disrupting
# in-flight publishes to ghcr.io).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  compute-matrix:
    name: Compute build matrix from upstream versions.json
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.set.outputs.builds }}
      latest: ${{ steps.set.outputs.latest }}
    steps:
      - uses: actions/checkout@v6

      - name: Install crane
        env:
          CRANE_VERSION: v0.20.2
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Log crane in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | crane auth login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - id: set
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: nextcloud-fpm-nginx
        run: |
          set -euo pipefail

          blocklist_file=.github/versions-blocklist.txt
          if [ -f "$blocklist_file" ]; then
            # grep -v returns 1 when nothing matches (all-comment file); tolerate it.
            blocklist=$(grep -vE '^\s*(#|$)' "$blocklist_file" || true)
            blocklist=$(printf '%s' "$blocklist" | tr '\n' ',' | sed 's/,$//')
          else
            blocklist=""
          fi
          echo "Blocklist: ${blocklist:-<none>}"

          curl -fsSL https://raw.githubusercontent.com/nextcloud/docker/master/versions.json \
            > versions.json

          jq -c --arg block "$blocklist" '
            ($block | split(",") | map(select(. != ""))) as $b
            | [ to_entries[]
                | select(.key as $k | $b | index($k) | not)
                | { major: .key, version: .value.version } ]
          ' versions.json > full-builds.json

          echo "Candidate builds (pre-gate):"
          jq . full-builds.json

          latest=$(jq -r 'map(.major | tonumber) | max' full-builds.json)
          echo "Latest non-blocked major: $latest"

          # Base-digest gate.
          #
          # On push/PR the user changed something in the repo (paths filter
          # already gates this), so we run the full matrix. On schedule (and
          # on workflow_dispatch unless `force=true`) we skip any major whose
          # already-published image is FROM the current upstream base digest.
          #
          # The gate compares two values:
          #   upstream = `crane digest nextcloud:<ver>-fpm`
          #   ours     = label `org.opencontainers.image.base.digest` on
          #              ghcr.io/<owner>/nextcloud-fpm-nginx:v<ver>
          # Rebuild reasons (any one triggers build):
          #   * ghcr tag missing (never built this version)
          #   * label missing (built before this gate existed; rebuild populates it)
          #   * digests differ (upstream refreshed Debian/PHP layers, or NC bumped)
          # Failure to resolve upstream digest is fail-open (rebuild) — a
          # transient registry hiccup must never silently leave us on a
          # stale base.
          gate=no
          case "$EVENT" in
            schedule) gate=yes ;;
            workflow_dispatch) [ "$FORCE" = "true" ] || gate=yes ;;
          esac

          if [ "$gate" = "yes" ]; then
            echo "Applying base-digest gate..."
            filtered='[]'
            while IFS= read -r row; do
              major=$(jq -r '.major' <<<"$row")
              version=$(jq -r '.version' <<<"$row")
              ghcr_ref="ghcr.io/${OWNER}/${IMAGE}:v${version}"
              upstream_ref="docker.io/library/nextcloud:${version}-fpm"

              keep_reason=""

              upstream_digest=$(crane digest "$upstream_ref" 2>/dev/null || true)
              if [ -z "$upstream_digest" ]; then
                echo "::warning::[$major] could not resolve $upstream_ref — including in build (fail-open)"
                keep_reason="upstream-resolve-failed"
              else
                our_cfg=$(crane config "$ghcr_ref" 2>/dev/null || true)
                if [ -z "$our_cfg" ]; then
                  keep_reason="ghcr-tag-missing"
                else
                  our_digest=$(jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty' <<<"$our_cfg")
                  if [ -z "$our_digest" ]; then
                    keep_reason="base-digest-label-missing"
                  elif [ "$our_digest" != "$upstream_digest" ]; then
                    keep_reason="base-digest-drift ($our_digest -> $upstream_digest)"
                  fi
                fi
              fi

              if [ -n "$keep_reason" ]; then
                echo "[$major] REBUILD: $keep_reason"
                filtered=$(jq -c --argjson r "$row" '. + [$r]' <<<"$filtered")
              else
                echo "[$major] skip — up to date ($upstream_digest)"
              fi
            done < <(jq -c '.[]' full-builds.json)
            builds="$filtered"
          else
            builds=$(cat full-builds.json)
          fi

          echo "Final builds:"
          echo "$builds" | jq

          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  # ─── amd64 test (Pattern A: build → load → test → only-then-push) ───
  # For each <major> × <scenario> cell:
  #   1. Build amd64-only into the local docker daemon (load: true).
  #   2. Run container-structure-test against the static image.
  #   3. Boot a docker compose fixture + run bats runtime tests.
  # The `build` job below blocks on this passing.
  test:
    name: Test (amd64) — ${{ matrix.build.major }} / ${{ matrix.scenario.id }}
    needs: compute-matrix
    # Skip cleanly when the base-digest gate filtered every major (cron no-op).
    if: needs.compute-matrix.outputs.builds != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.compute-matrix.outputs.builds) }}
        scenario:
          - { id: sqlite-noredis-cron-none,            db: sqlite,   redis: 'false', notify_push: 'false', cron: none        }
          - { id: sqlite-noredis-cron-incontainer,     db: sqlite,   redis: 'false', notify_push: 'false', cron: incontainer }
          - { id: sqlite-noredis-cron-sidecar,         db: sqlite,   redis: 'false', notify_push: 'false', cron: sidecar     }
          - { id: postgres-redis-notify-cron-none,     db: postgres, redis: 'true',  notify_push: 'true',  cron: none        }
          - { id: postgres-redis-notify-cron-incontainer, db: postgres, redis: 'true', notify_push: 'true', cron: incontainer }
          - { id: postgres-redis-notify-cron-sidecar,  db: postgres, redis: 'true',  notify_push: 'true',  cron: sidecar     }
          - { id: postgres-redis-nopush-cron-none,     db: postgres, redis: 'true',  notify_push: 'false', cron: none        }
          - { id: postgres-redis-nopush-cron-incontainer, db: postgres, redis: 'true', notify_push: 'false', cron: incontainer }
          - { id: postgres-redis-nopush-cron-sidecar,  db: postgres, redis: 'true',  notify_push: 'false', cron: sidecar     }
          - { id: mysql-redis-notify-cron-none,        db: mysql,    redis: 'true',  notify_push: 'true',  cron: none        }
          - { id: mysql-redis-notify-cron-incontainer, db: mysql,    redis: 'true',  notify_push: 'true',  cron: incontainer }
          - { id: mysql-redis-notify-cron-sidecar,     db: mysql,    redis: 'true',  notify_push: 'true',  cron: sidecar     }
          - { id: mysql-redis-nopush-cron-none,        db: mysql,    redis: 'true',  notify_push: 'false', cron: none        }
          - { id: mysql-redis-nopush-cron-incontainer, db: mysql,    redis: 'true',  notify_push: 'false', cron: incontainer }
          - { id: mysql-redis-nopush-cron-sidecar,     db: mysql,    redis: 'true',  notify_push: 'false', cron: sidecar     }
        # 2 majors × 15 scenarios = 30 matrix cells
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 image (load locally — Pattern A)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nextcloud-fpm-nginx:test-${{ matrix.build.major }}
          build-args: |
            NC_VERSION=${{ matrix.build.version }}
          cache-from: type=gha,scope=nc-${{ matrix.build.major }}-amd64
          cache-to: type=gha,scope=nc-${{ matrix.build.major }}-amd64,mode=max

      - name: container-structure-test (image-static assertions)
        env:
          IMG: nextcloud-fpm-nginx:test-${{ matrix.build.major }}
          CST_VERSION: v1.22.1
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-amd64"
          chmod +x /usr/local/bin/container-structure-test
          container-structure-test test --image "$IMG" \
            --config tests/cst/base.yaml \
            --config tests/cst/nginx.yaml \
            --config tests/cst/php.yaml \
            --config tests/cst/notify_push.yaml

      - name: Install bats-core
        uses: bats-core/bats-action@4.0.0

      - name: Run bats suite (runtime assertions)
        env:
          NC_IMAGE: nextcloud-fpm-nginx:test-${{ matrix.build.major }}
          NC_MAJOR: ${{ matrix.build.major }}
          SCENARIO_DB: ${{ matrix.scenario.db }}
          SCENARIO_REDIS: ${{ matrix.scenario.redis }}
          SCENARIO_NOTIFY_PUSH: ${{ matrix.scenario.notify_push }}
          SCENARIO_CRON: ${{ matrix.scenario.cron }}
        run: ./tests/run-all.sh

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.build.major }}-${{ matrix.scenario.id }}
          path: tests/reports/*.xml

      - name: Surface bats failures in PR / run summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: tests/reports/*.xml
          check_name: bats / ${{ matrix.build.major }} / ${{ matrix.scenario.id }}

  # ─── arm64 smoke (native GH-hosted runner — no QEMU) ───
  # Builds for arm64, loads locally, runs only the CST suite + a manual
  # `nginx -t` / `php-fpm -t` / `notify_push --version` triplet. Full bats
  # is amd64-only because arm64 native runner availability is rate-limited.
  test-arm64-smoke:
    name: Smoke (arm64) — ${{ matrix.build.major }}
    needs: compute-matrix
    if: needs.compute-matrix.outputs.builds != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.compute-matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build arm64 image (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: nextcloud-fpm-nginx:test-arm-${{ matrix.build.major }}
          build-args: |
            NC_VERSION=${{ matrix.build.version }}
          cache-from: type=gha,scope=nc-${{ matrix.build.major }}-arm64
          cache-to: type=gha,scope=nc-${{ matrix.build.major }}-arm64,mode=max

      - name: container-structure-test
        env:
          IMG: nextcloud-fpm-nginx:test-arm-${{ matrix.build.major }}
          CST_VERSION: v1.22.1
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-arm64"
          chmod +x /usr/local/bin/container-structure-test
          container-structure-test test --image "$IMG" \
            --config tests/cst/base.yaml \
            --config tests/cst/nginx.yaml \
            --config tests/cst/php.yaml \
            --config tests/cst/notify_push.yaml

      - name: Smoke (nginx -t, php-fpm -t, notify_push --version)
        run: |
          IMG=nextcloud-fpm-nginx:test-arm-${{ matrix.build.major }}
          docker run --rm --entrypoint=nginx "$IMG" -t
          docker run --rm --entrypoint=php-fpm "$IMG" -t
          docker run --rm --entrypoint=/usr/local/bin/notify_push "$IMG" --version

  # ─── Single umbrella check for branch-protection rulesets ───
  # The matrix-job names contain the NC major (e.g. "Test (amd64) — 33 / …"),
  # so they change every time upstream cuts a new major and aren't usable as
  # stable required-status-check contexts. `all-ci` is the stable gate: it has
  # no name suffix, succeeds iff every dependency succeeded, and is the only
  # check the ruleset needs to reference.
  all-ci:
    name: all-ci
    needs: [compute-matrix, test, test-arm64-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          set -euo pipefail
          # `skipped` is acceptable on test/test-arm64-smoke: the compute-matrix
          # gate may filter every major on a cron run when nothing upstream
          # changed. compute-matrix itself must always succeed (it's the gate).
          if [ "${{ needs.compute-matrix.result }}" != success ]; then
            echo "::error::compute-matrix=${{ needs.compute-matrix.result }}"
            exit 1
          fi
          fail=0
          for r in 'test=${{ needs.test.result }}' \
                   'test-arm64-smoke=${{ needs.test-arm64-smoke.result }}'; do
            val="${r#*=}"
            case "$val" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::test=${{ needs.test.result }}, test-arm64-smoke=${{ needs.test-arm64-smoke.result }}"
            exit 1
          fi

  # ─── Build + push multi-arch (only after tests pass) ───
  # Reuses the buildx cache populated by the test jobs, so amd64+arm64 here
  # is mostly cache hits — only the final manifest push + provenance attest
  # is real work.
  build:
    name: Build & push — v${{ matrix.build.version }}
    # Skip pushes on PRs — dependabot PRs are untrusted with packages: write,
    # and we don't want PR builds clobbering published tags. The push runs on
    # the merge commit (push to master) instead. Also skip when the gate
    # filtered every major (nothing to rebuild).
    if: github.event_name != 'pull_request' && needs.compute-matrix.outputs.builds != '[]'
    needs: [compute-matrix, test, test-arm64-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.compute-matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextcloud-fpm-nginx
          tags: |
            type=raw,value=v${{ matrix.build.version }}
            type=raw,value=v${{ matrix.build.major }}.0
            type=raw,value=v${{ matrix.build.major }}
            type=raw,value=latest,enable=${{ matrix.build.major == needs.compute-matrix.outputs.latest }}

      # Resolve the upstream FROM-image digest right before build, and bake it
      # into the published image as `org.opencontainers.image.base.digest`.
      # The compute-matrix gate reads this label on the next run to decide
      # whether the base has drifted. `pull: true` on build-push-action below
      # forces buildx to pull the latest manifest, so the digest captured here
      # matches what the build actually uses (within a tiny race window — any
      # repush in those seconds just causes one extra rebuild next run).
      - id: base
        name: Resolve upstream base digest
        env:
          CRANE_VERSION: v0.20.2
          NC_VERSION: ${{ matrix.build.version }}
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          base_name="docker.io/library/nextcloud:${NC_VERSION}-fpm"
          base_digest=$(crane digest "$base_name")
          echo "base_name=$base_name"     >> "$GITHUB_OUTPUT"
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            NC_VERSION=${{ matrix.build.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.base_digest }}
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=nc-${{ matrix.build.major }}-amd64
            type=gha,scope=nc-${{ matrix.build.major }}-arm64
          cache-to: type=gha,scope=nc-${{ matrix.build.major }},mode=max
