[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Optional programs (notify_push, cron) are dropped here by
# render-overrides.sh when the corresponding env vars are set.
[include]
files = /etc/supervisor/conf.d/*.conf

# Upstream entrypoint runs install/upgrade as root, then execs php-fpm.
# Inside the entrypoint the user is dropped to www-data via `su -p` where
# appropriate (occ calls, hooks). The php-fpm master listens on :9000 as root
# and the worker pool drops to www-data per the upstream FPM pool config.
[program:nextcloud]
# The upstream entrypoint gates install/upgrade on `$1 == "php-fpm"` exactly
# (see /entrypoint.sh ~line 142). Must pass `php-fpm` (no path) so the gate
# matches, then -F so the resulting php-fpm runs in foreground.
command=/entrypoint.sh php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopwaitsecs=30

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopwaitsecs=15
