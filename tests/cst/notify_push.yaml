schemaVersion: 2.0.0

commandTests:
  # Shape-only: proves the binary runs and reports a semver. The EXACT version
  # is asserted == NOTIFY_PUSH_VERSION at build time in the Dockerfile, the
  # single source of truth — so this never needs a bump.
  - name: notify_push binary reports a valid version
    command: /usr/local/bin/notify_push
    args: ['--version']
    exitCode: 0
    expectedOutput: ['notify_push [0-9]+\.[0-9]+\.[0-9]+']

  - name: notify-push-wrapper invokes the binary path correctly
    command: grep
    args: ['-E', '^\s*/usr/local/bin/notify_push ', '/usr/local/bin/notify-push-wrapper.sh']
    exitCode: 0

  - name: wrapper uses occ for app:install + setup
    command: sh
    args:
      - '-c'
      - 'grep -E "app:install notify_push|notify_push:setup" /usr/local/bin/notify-push-wrapper.sh'
    exitCode: 0
