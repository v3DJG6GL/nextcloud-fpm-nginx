# Test fixture: SQLite (no DB service, no Redis). Lightest fixture; smoke + a few
# scenarios that don't need Redis (cron-sidecar, no notify_push).
services:
  nc: &nc
    image: ${NC_IMAGE:-local/nc-fpm-nginx:test}
    environment:
      SQLITE_DATABASE: nc.db
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: changeme
      NEXTCLOUD_TRUSTED_DOMAINS: localhost example.test
      # notify_push REQUIRES a non-SQLite DB; force it off here regardless of input.
      NOTIFY_PUSH_ENABLE: 'false'
      NEXTCLOUD_CRON_ENABLE: ${NC_CRON_INCONTAINER:-false}
      PHP_TIMEZONE: America/Anchorage
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 4G
      PHP_OPCACHE_MEMORY_CONSUMPTION: 256
      PHP_OPCACHE_MAX_ACCELERATED_FILES: 50000
      PHP_OPCACHE_JIT_BUFFER_SIZE: 384M
      PHP_OPCACHE_INTERNED_STRINGS_BUFFER: 64
      FPM_PM: static
      FPM_PM_MAX_CHILDREN: 9
      FPM_REQUEST_TERMINATE_TIMEOUT: 300
      NGINX_SERVER_NAME: test.local
      NGINX_HSTS: "max-age=31536000; includeSubDomains"
    ports:
      - '0:80'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl -fsS http://127.0.0.1/status.php | grep -q ''"installed":true'' || exit 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  nc-cron:
    <<: *nc
    profiles: [cron-sidecar]
    entrypoint: []
    command: ['/cron.sh']
    # Trivial PID-1 liveness probe. `disable: true` makes `compose up --wait`
    # fail with "no healthcheck configured" on compose v2.35+, so we give it
    # a real (cheap) check instead of inheriting the parent's php-fpm probe.
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    depends_on:
      nc: { condition: service_healthy }
    ports: []
