# Upgrade fixture — used by tests/bats/23-upgrade-fresh.bats.
# Boots NC ${NC_VERSION_FROM} (e.g. 32.0.9), waits for install, swaps to
# ${NC_IMAGE} (the under-test build, NC_VERSION current), expects occ upgrade.
#
# Volumes are persistent for the lifetime of the test (compose down -v at end).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: pgpass
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nextcloud']
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30

  # Start with the PRIOR major version. The bats test will `compose stop nc`
  # then change the image and `compose up -d nc` again.
  nc:
    image: ${NC_IMAGE:-local/nc-fpm-nginx:test}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: pgpass
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: changeme
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - nc-data:/var/www/html
    ports:
      - '0:80'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl -fsS http://127.0.0.1/status.php | grep -q ''"installed":true'' || exit 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s   # upgrade can take a while

volumes:
  nc-data:
