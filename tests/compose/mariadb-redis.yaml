# Test fixture: MariaDB + Redis + nextcloud-fpm-nginx (mirror of postgres-redis).
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: mariapass
      MARIADB_ROOT_PASSWORD: mariarootpass
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -uroot -pmariarootpass']
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30

  nc: &nc
    image: ${NC_IMAGE:-local/nc-fpm-nginx:test}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: mariapass
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: changeme
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      NOTIFY_PUSH_ENABLE: ${SCENARIO_NOTIFY_PUSH:-false}
      NEXTCLOUD_CRON_ENABLE: ${NC_CRON_INCONTAINER:-false}
    ports:
      - '0:80'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl -fsS http://127.0.0.1/status.php | grep -q ''"installed":true'' || exit 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  nc-cron:
    <<: *nc
    profiles: [cron-sidecar]
    entrypoint: []
    command: ['/cron.sh']
    healthcheck:
      disable: true
    depends_on:
      nc: { condition: service_healthy }
    ports: []
