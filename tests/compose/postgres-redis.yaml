# Test fixture: Postgres + Redis + nextcloud-fpm-nginx
#
# Used by tests/run-all.sh for SCENARIO_DB=postgres. Env vars passed in:
#   NC_IMAGE                 — image-under-test
#   SCENARIO_NOTIFY_PUSH     — true/false → NOTIFY_PUSH_ENABLE on nc
#   SCENARIO_CRON            — incontainer/sidecar/none
#   COMPOSE_PROFILES=cron-sidecar  (activated by run-all.sh if cron=sidecar)

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: pgpass
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nextcloud']
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30

  nc: &nc
    image: ${NC_IMAGE:-local/nc-fpm-nginx:test}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: pgpass
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: changeme
      NEXTCLOUD_TRUSTED_DOMAINS: localhost example.test
      NOTIFY_PUSH_ENABLE: ${SCENARIO_NOTIFY_PUSH:-false}
      NEXTCLOUD_CRON_ENABLE: ${NC_CRON_INCONTAINER:-false}
      # Representative test values for env-override assertions (tests/bats/03-05).
      PHP_TIMEZONE: America/Anchorage
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 4G
      PHP_OPCACHE_MEMORY_CONSUMPTION: 256
      PHP_OPCACHE_MAX_ACCELERATED_FILES: 50000
      PHP_OPCACHE_JIT_BUFFER_SIZE: 384M
      PHP_OPCACHE_INTERNED_STRINGS_BUFFER: 64
      FPM_PM: static
      FPM_PM_MAX_CHILDREN: 9
      FPM_REQUEST_TERMINATE_TIMEOUT: 300
      NGINX_SERVER_NAME: test.local
      NGINX_HSTS: "max-age=31536000; includeSubDomains"
    ports:
      - '0:80'    # ephemeral host port; tests resolve via `docker compose port nc 80`
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl -fsS http://127.0.0.1/status.php | grep -q ''"installed":true'' || exit 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Cron sidecar — only runs when run-all.sh activates the profile.
  nc-cron:
    <<: *nc
    profiles: [cron-sidecar]
    entrypoint: []
    command: ['/cron.sh']
    # Trivial PID-1 liveness probe. `disable: true` makes `compose up --wait`
    # fail with "no healthcheck configured" on compose v2.35+, so we give it
    # a real (cheap) check instead of inheriting the parent's php-fpm probe.
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    depends_on:
      nc: { condition: service_healthy }
    ports: []
