# Adapted from the upstream Nextcloud 33 reference (# Version 2025-07-23):
# https://docs.nextcloud.com/server/33/admin_manual/installation/nginx.html
#
# Differences from the upstream reference:
#   * No port-80 -> 443 redirect server block: this nginx terminates HTTP only,
#     TLS is handled by the outer reverse proxy.
#   * `listen 80` instead of `listen 443 ssl http2`.
#   * `ssl_*` directives removed.
#   * `fastcgi_param HTTPS` is dynamic via `map $http_x_forwarded_proto`
#     (default `on`, honors `X-Forwarded-Proto: http` if the proxy passes it).
#   * `set_real_ip_from` added for RFC1918 + ULA so $remote_addr reflects the
#     real client when behind a private-network reverse proxy.
#   * `server_name _` catch-all (patched at startup from $NGINX_SERVER_NAME).
#   * Security headers live in /etc/nginx/snippets/nc-security-headers.conf and
#     are `include`d at server scope AND in the static-asset location (nginx
#     resets inherited add_headers per block). HSTS (NGINX_HSTS env var) is
#     rendered by the entrypoint into /etc/nginx/snippets/nc-hsts.conf and
#     included alongside them.
#   * `include /etc/nginx/conf.d/*.conf` remains a generic drop-in extension
#     point (server scope).

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    # Add `.mjs` (ES modules) to the inherited mime map. MUST live in http {}
    # so it MERGES with the included mime.types — a `types {}` block inside
    # `server {}` would REPLACE the inherited map and break every other type
    # (html → text/html, css → text/css, js → application/javascript). With
    # `X-Content-Type-Options: nosniff` set on every response, an octet-stream
    # mime breaks browser JS/CSS execution entirely (login form fails to mount).
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Trust private-network reverse proxies so $remote_addr is the real client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    upstream php-handler {
        server 127.0.0.1:9000;
    }

    map $arg_v $asset_immutable {
        ""      "";
        default ", immutable";
    }

    # Dynamic HTTPS flag for FastCGI: default on (assumes TLS at outer proxy);
    # honor X-Forwarded-Proto when the proxy sets it.
    map $http_x_forwarded_proto $forwarded_https {
        default on;
        http    off;
        https   on;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/html;
        index index.php index.html /index.php$request_uri;

        # Upload-path tuning. Defaults are tuned for small files; large-file
        # uploads (multi-GiB via DAV chunked) need:
        #   client_max_body_size 0 — unlimited; the actual cap is enforced
        #     by Nextcloud (`files.chunked_upload.max_size` in config.php).
        #     A bytes-level nginx cap forces awkward dual-knob tuning and
        #     bites you the moment the NC value gets bumped.
        #   client_body_timeout 3600s — slow residential uplinks can take
        #     >5min for a single 100+MiB chunk; 1h is a safe ceiling.
        client_max_body_size 0;
        client_body_timeout 3600s;
        client_body_buffer_size 512k;
        fastcgi_buffers 64 4K;

        gzip on;
        gzip_vary on;
        gzip_comp_level 4;
        gzip_min_length 256;
        gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
        gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

        # Security headers. Kept in a snippet (single source of truth) and also
        # re-included in the static-asset location below, because nginx resets
        # inherited add_headers in any block that declares its own. nc-hsts.conf
        # is generated by render-overrides.sh (empty unless NGINX_HSTS is set).
        include /etc/nginx/snippets/nc-security-headers.conf;
        include /etc/nginx/snippets/nc-hsts.conf;

        fastcgi_hide_header X-Powered-By;

        location = / {
            if ( $http_user_agent ~ ^DavClnt ) {
                return 302 /remote.php/webdav/$is_args$args;
            }
        }

        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }

        location ^~ /.well-known {
            location = /.well-known/carddav { return 301 /remote.php/dav/; }
            location = /.well-known/caldav  { return 301 /remote.php/dav/; }

            location /.well-known/acme-challenge { try_files $uri $uri/ =404; }
            location /.well-known/pki-validation { try_files $uri $uri/ =404; }

            return 301 /index.php$request_uri;
        }

        location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)  { return 404; }
        location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)                { return 404; }

        # notify_push WebSocket endpoint. Returns 502 if the binary isn't
        # running (i.e., NOTIFY_PUSH_ENABLE is not set) — harmless because
        # nothing in Nextcloud requests this URL unless the companion app
        # has been registered via `occ notify_push:setup`.
        location ^~ /push/ {
            proxy_pass http://127.0.0.1:7867/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        location ~ \.php(?:$|/) {
            rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

            fastcgi_split_path_info ^(.+?\.php)(/.*)?$;
            set $path_info $fastcgi_path_info;

            try_files $fastcgi_script_name =404;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_param HTTPS $forwarded_https;

            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass php-handler;

            fastcgi_intercept_errors on;
            # Stream the request body straight to php-fpm as bytes arrive,
            # instead of buffering the entire body to /var/lib/nginx/body
            # (container writable layer!) before forwarding. For DAV chunked
            # uploads with multi-MiB chunks, buffering = (chunk_size ×
            # parallel_count) of temp files on the container's overlayfs,
            # which on hybrid SSD+HDD setups lands on the HDD and serialises
            # every upload behind the same spindle. nginx loses its ability
            # to retry on FPM failure, but DAV chunked uploads retry at the
            # application layer anyway.
            fastcgi_request_buffering off;

            # Long FastCGI timeouts for slow chunked uploads. With
            # `fastcgi_request_buffering off` (above), nginx streams body
            # bytes straight to FPM as they arrive from the slow uplink —
            # FPM workers can sit idle for minutes waiting on the next
            # body byte. The default 60s `fastcgi_send_timeout` will close
            # the FPM socket mid-stream, which php-src #12343 mistreats as
            # clean EOF (instead of a truncation), and Sabre then throws
            # BadRequest with "Expected N bytes but read M". 1h ceiling
            # matches client_body_timeout.
            fastcgi_read_timeout 3600s;
            fastcgi_send_timeout 3600s;

            fastcgi_max_temp_file_size 0;
        }

        location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac|mp4|webm)$ {
            try_files $uri /index.php$request_uri;
            add_header Cache-Control                     "public, max-age=15778463$asset_immutable";
            # Re-include security headers + HSTS: this location declares its own
            # add_header (Cache-Control above), which would otherwise reset the
            # server-scope set — including HSTS — for static assets.
            include /etc/nginx/snippets/nc-security-headers.conf;
            include /etc/nginx/snippets/nc-hsts.conf;
            access_log off;
        }

        location ~ \.(otf|woff2?)$ {
            try_files $uri /index.php$request_uri;
            expires 7d;
            access_log off;
        }

        location /remote {
            return 301 /remote.php$request_uri;
        }

        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }

        include /etc/nginx/conf.d/*.conf;
    }
}
