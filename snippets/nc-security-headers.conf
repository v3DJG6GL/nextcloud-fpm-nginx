# Static security headers, included at BOTH server scope and inside any location
# that declares its own `add_header` (nginx resets inherited add_headers per
# block, so such a location must re-include these or it silently drops them).
# Single source of truth — edit here, not in nginx.conf. HSTS is separate
# (dynamic, env-driven) and lives in nc-hsts.conf, generated by render-overrides.sh.
add_header Referrer-Policy                   "no-referrer"       always;
add_header X-Content-Type-Options            "nosniff"           always;
add_header X-Frame-Options                   "SAMEORIGIN"        always;
add_header X-Permitted-Cross-Domain-Policies "none"              always;
add_header X-Robots-Tag                      "noindex, nofollow" always;
